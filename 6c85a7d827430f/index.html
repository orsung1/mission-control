<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080a;
    --card: rgba(255,255,255,0.028);
    --card-border: rgba(255,255,255,0.065);
    --text: #f4f4f5; --text2: #9d9da8; --text3: #5c5c66;
    --waiting: #fbbf24; --progress: #6ea8fe; --remind: #b79ffd; --docs: #4ade80; --done: #63636e; --watching: #38bdf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: 'cv11', 'ss01';
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(600px 340px at 50% -80px, rgba(110,168,254,0.07), transparent 70%),
      radial-gradient(500px 300px at 85% 0%, rgba(183,159,253,0.05), transparent 70%);
  }
  .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 0 18px calc(48px + env(safe-area-inset-bottom)); }

  #ptr { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-46px); z-index: 60; transition: transform .28s cubic-bezier(.2,.9,.3,1.2); }
  #ptr.on { transform: translateX(-50%) translateY(0); }
  #ptr .pill { width: 34px; height: 34px; border-radius: 50%; background: #17171c; border: 1px solid var(--card-border); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #ptr .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.14); border-top-color: #d4d4d8; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  header { padding: calc(30px + env(safe-area-inset-top)) 2px 4px; display: flex; align-items: center; justify-content: space-between; }
  .title-block { display: flex; align-items: center; gap: 11px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
    background: linear-gradient(140deg, #23232b 0%, #101014 100%);
    border: 1px solid rgba(255,255,255,.09);
    display: grid; place-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 4px 14px rgba(0,0,0,.4); }
  .mark svg { width: 17px; height: 17px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.025em; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: #4ade80; padding: 5px 10px; border: 1px solid rgba(74,222,128,.18); background: rgba(74,222,128,.06); border-radius: 999px; transition: all .3s; }
  .live .dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: pulse 2.2s ease-in-out infinite; }
  .live.fresh { color: #a7f3d0; border-color: rgba(74,222,128,.45); background: rgba(74,222,128,.13); }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.8); } }
  .digest { font-size: 12.5px; color: var(--text2); padding: 8px 2px 2px; font-weight: 480; letter-spacing: -0.005em; }
  .updated { font-size: 11.5px; color: var(--text3); padding: 4px 2px 12px; cursor: pointer; font-weight: 450; }
  .updated:active { color: var(--text2); }

  #away { display: none; margin: 4px 0 14px; padding: 12px 15px; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, rgba(110,168,254,.10), rgba(183,159,253,.08));
    border: 1px solid rgba(110,168,254,.22);
    font-size: 13px; font-weight: 500; color: #c7d7f5; line-height: 1.45;
    animation: rise .5s cubic-bezier(.2,.8,.3,1) backwards; }
  #away .sub { display: block; font-size: 11.5px; color: var(--text2); font-weight: 450; margin-top: 3px; }

  .searchbox { position: sticky; top: 0; z-index: 30; padding: 4px 0 10px; background: linear-gradient(var(--bg) 78%, transparent); }
  .searchbox .in { position: relative; }
  .searchbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; opacity: .45; pointer-events: none; }
  .searchbox input { width: 100%; background: var(--card); border: 1px solid var(--card-border); border-radius: 13px;
    padding: 11.5px 14px 11.5px 37px; color: var(--text); font-size: 14.5px; font-family: inherit; outline: none;
    transition: border-color .15s, background .15s; }
  .searchbox input::placeholder { color: var(--text3); }
  .searchbox input:focus { border-color: rgba(255,255,255,.16); background: rgba(255,255,255,.045); }

  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.areas { padding-bottom: 14px; }
  .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 7.5px 13px; border-radius: 999px;
    font-size: 12.5px; font-weight: 550; letter-spacing: -0.005em;
    background: var(--card); border: 1px solid var(--card-border); color: var(--text2); cursor: pointer;
    transition: all .18s cubic-bezier(.3,.7,.4,1); user-select: none; }
  .chip .n { font-size: 11px; font-weight: 600; color: var(--text3); font-variant-numeric: tabular-nums; background: rgba(255,255,255,.05); padding: 1px 6px; border-radius: 6px; }
  .chip .cdot { width: 6px; height: 6px; border-radius: 50%; }
  .chip.active { background: #ececef; color: #0a0a0c; border-color: transparent; }
  .chip.active .n { background: rgba(0,0,0,.09); color: #3f3f46; }
  .chip:active { transform: scale(.96); }
  .chip.area { font-size: 11.5px; padding: 6px 11px; color: var(--text3); }
  .chip.area.active { background: rgba(255,255,255,.12); color: var(--text); border-color: rgba(255,255,255,.2); }

  section { margin-bottom: 24px; }
  .sect-label { display: flex; align-items: center; gap: 8px; margin: 0 3px 11px; }
  .sect-label .dot { width: 6px; height: 6px; border-radius: 50%; }
  .sect-label .name { font-size: 11px; font-weight: 650; letter-spacing: .11em; text-transform: uppercase; color: var(--text2); }
  .sect-label .count { font-size: 11px; font-weight: 550; color: var(--text3); font-variant-numeric: tabular-nums; }
  .sortbtn { margin-left: auto; display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text3); font-size: 10.5px; font-weight: 550; font-family: inherit; cursor: pointer; padding: 3px 6px; border-radius: 6px; letter-spacing: .03em; }
  .sortbtn:active { background: rgba(255,255,255,.07); }
  .sortbtn svg { width: 10px; height: 10px; opacity: .7; }

  .card-wrap { position: relative; margin-bottom: 9px; overflow: hidden; border-radius: 15px; }
  .card { display: block; position: relative; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 15px; padding: 12px 15px;
    text-decoration: none; color: inherit; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: background .15s, border-color .15s, transform .18s, opacity .18s;
    animation: rise .38s cubic-bezier(.2,.8,.3,1) backwards;
    touch-action: pan-y; }
  .card:nth-child(2) { animation-delay: .03s; } .card:nth-child(3) { animation-delay: .06s; }
  .card:nth-child(4) { animation-delay: .09s; } .card:nth-child(5) { animation-delay: .12s; }
  .card:nth-child(n+6) { animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .card.leaving { transition: transform .22s ease-in, opacity .22s ease-in; transform: translateX(-110%); opacity: 0; }
  .card .t { padding-right: 20px; font-size: 14px; font-weight: 550; line-height: 1.38; letter-spacing: -0.012em; }
  .card .d { font-size: 12.5px; color: var(--text2); line-height: 1.5; margin-top: 5px; font-weight: 420;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--text3); font-weight: 500; }
  .card .meta .r { margin-left: auto; }
  .tag { padding: 2.5px 8px; border-radius: 7px; background: rgba(255,255,255,.055); font-weight: 550; font-size: 10.5px; letter-spacing: .01em; }
  .card .ext { position: absolute; top: 15px; right: 15px; opacity: .35; }
  .card .ext svg { width: 13px; height: 13px; display: block; }
  footer a svg { width: 11px; height: 11px; display: inline-block; vertical-align: -1px; margin-left: 3px; }

  .prog-dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--progress); box-shadow: 0 0 7px rgba(110,168,254,.8); animation: pulse 1.8s ease-in-out infinite; }
  .prog-row { display: flex; align-items: center; gap: 8px; }

  .done-card { opacity: .55; }
  .done-card .t { color: var(--text2); }
  .done-card .t::before { content: '✓ '; color: #4ade80; font-weight: 600; }
  .hidden-card { opacity: .5; }
  .hidden-card .t { color: var(--text3); text-decoration: line-through; text-decoration-color: #3f3f46; }
  .restore { position: absolute; top: 50%; right: 14px; transform: translateY(-50%); font-size: 11.5px; font-weight: 600; color: var(--text2); padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,.07); }

  .swipe-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px;
    background: linear-gradient(90deg, transparent, rgba(244,63,94,.14)); color: #fb7185; font-size: 11.5px; font-weight: 600; letter-spacing: .06em;
    opacity: 0; transition: opacity .12s; border-radius: 15px; }
  .swipe-hint.left { justify-content: flex-start; padding-left: 22px; padding-right: 0; background: linear-gradient(-90deg, transparent, rgba(244,63,94,.14)); }

  .empty { font-size: 12.5px; color: var(--text3); padding: 18px 4px; font-weight: 450; text-align: center; }
  .empty .big { display: block; font-size: 14px; color: var(--text2); font-weight: 550; margin-bottom: 4px; }

  footer { text-align: center; padding: 26px 0 10px; }
  footer a { font-size: 12.5px; font-weight: 500; color: var(--text2); text-decoration: none; padding: 9px 16px; border: 1px solid var(--card-border); border-radius: 999px; background: var(--card); display: inline-block; }
  footer a:active { background: rgba(255,255,255,.06); }
  #err { display: none; margin: 4px 0 16px; padding: 11px 15px; border: 1px solid rgba(248,113,113,.22); background: rgba(248,113,113,.07); color: #fca5a5; border-radius: 13px; font-size: 12.5px; font-weight: 500; }

  #toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(80px); z-index: 70;
    display: flex; align-items: center; gap: 12px; background: #1c1c22; border: 1px solid rgba(255,255,255,.1);
    padding: 11px 16px; border-radius: 13px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 32px rgba(0,0,0,.55);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.15); max-width: 90vw; }
  #toast.on { transform: translateX(-50%) translateY(0); }
  #toast button { background: none; border: none; color: #6ea8fe; font-size: 13px; font-weight: 650; font-family: inherit; cursor: pointer; padding: 2px 4px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 65; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
  .backdrop.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 560px; margin: 0 auto;
    background: #101014; border: 1px solid var(--card-border); border-bottom: none; border-radius: 20px 20px 0 0;
    max-height: 82vh; display: flex; flex-direction: column; transform: translateY(102%); transition: transform .3s cubic-bezier(.32,.72,.28,1); }
  .sheet.on { transform: translateY(0); }
  .sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 10px auto 2px; flex: none; }
  .sheet .body { overflow-y: auto; padding: 12px 20px 20px; -webkit-overflow-scrolling: touch; }
  .sheet h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; margin: 6px 0 4px; }
  .sheet .smeta { font-size: 11.5px; color: var(--text3); font-weight: 500; margin-bottom: 14px; }
  .sheet .detail { font-size: 13.5px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .sheet .sect-h { font-size: 10.5px; font-weight: 650; letter-spacing: .14em; color: var(--text3); margin: 18px 0 8px; }
  .sheet .links { display: flex; flex-wrap: wrap; gap: 7px; }
  .sheet .links a { font-size: 12px; font-weight: 500; color: #8ab8ff; background: rgba(110,150,255,.1); border: 1px solid rgba(110,150,255,.18);
    padding: 6px 11px; border-radius: 999px; text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .msg { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 10px 13px; margin-bottom: 8px; }
  .sheet .msg .mt { font-size: 10.5px; color: var(--text3); margin-bottom: 4px; font-weight: 550; }
  .sheet .msg .mb { font-size: 12.5px; color: var(--text2); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .replybox { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.07); flex: none; background: #0d0d11; }
  .replybox textarea { flex: 1; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: var(--text);
    font: inherit; font-size: 13px; padding: 10px 12px; resize: none; height: 42px; outline: none; }
  .replybox textarea:focus { border-color: rgba(120,160,255,.45); }
  .replybox button { background: #2f6bff; color: #fff; border: none; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 600; }
  .replybox button:disabled { opacity: .4; }

  .acts { display: flex; gap: 6px; margin-top: 9px; }
  .acts button { font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--text3);
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .acts button:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .acts button.pinned { color: #7cc7ff; border-color: rgba(124,199,255,.35); background: rgba(124,199,255,.09); }
  .card.is-pinned { border-color: rgba(124,199,255,.3); }
  .sheet .actrow { display: flex; gap: 8px; margin: 12px 0 2px; }
  .sheet .actrow button { font: inherit; font-size: 12px; font-weight: 600; color: var(--text2); background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 7px 14px; cursor: pointer; }
  .sheet .actrow button.pinned { color: #7cc7ff; border-color: rgba(124,199,255,.35); }


  .card.compact { padding: 10px 13px; border-radius: 13px; }
  .card.compact .t { font-size: 13px; padding-right: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.compact .meta { margin-top: 4px; }
  .card.compact .acts { margin-top: 6px; }
  .acts { flex-wrap: wrap; }
  .acts button.act { color: #8ab8ff; border-color: rgba(110,150,255,.22); background: rgba(110,150,255,.07); }
  .acts button.act[data-act="Done"] { color: #4ade80; border-color: rgba(74,222,128,.28); background: rgba(74,222,128,.07); }
  .acts button.act[data-act="Snooze"] { color: #fbbf24; border-color: rgba(251,191,36,.28); background: rgba(251,191,36,.07); }
  .acts button.act[data-act="Kill"] { color: #fb7185; border-color: rgba(244,63,94,.25); background: rgba(244,63,94,.07); }
  .foc-note { font-size: 12px; color: var(--text3); text-align: center; padding: 4px 0 10px; font-weight: 450; }
  .foc-note b { color: var(--text2); font-weight: 600; }


  .vtoggle { display: flex; justify-content: flex-end; margin: -4px 0 12px; }
  .vtoggle button { font: inherit; font-size: 11px; font-weight: 600; color: var(--text3); background: var(--card); border: 1px solid var(--card-border); padding: 6px 14px; cursor: pointer; }
  .vtoggle button:first-child { border-radius: 9px 0 0 9px; border-right: none; }
  .vtoggle button:last-child { border-radius: 0 9px 9px 0; }
  .vtoggle button.active { background: #ececef; color: #0a0a0c; border-color: transparent; }

  .board { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px; padding: 2px 18px 10px; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .bcol { flex: 0 0 76%; max-width: 290px; scroll-snap-align: start; background: rgba(255,255,255,.018); border: 1px solid var(--card-border); border-radius: 16px; padding: 10px; min-height: 180px; transition: border-color .15s, background .15s; }
  @media (min-width: 720px) { .bcol { flex: 1 1 0; max-width: none; } }
  .bcol.hot { border-color: rgba(124,199,255,.55); background: rgba(124,199,255,.06); }
  .bcol .bh { display: flex; align-items: center; gap: 7px; margin: 2px 2px 10px; font-size: 10.5px; font-weight: 650; letter-spacing: .11em; text-transform: uppercase; color: var(--text2); }
  .bcard { background: rgba(255,255,255,.04); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  .bcard:active { cursor: grabbing; }
  .bcard.dragging { opacity: .35; }
  .bcard.moved { border-style: dashed; border-color: rgba(124,199,255,.4); }
  .bcard .bt { font-size: 12.5px; font-weight: 550; line-height: 1.35; letter-spacing: -0.008em; }
  .bcard .bm { font-size: 10.5px; color: var(--text3); margin-top: 4px; font-weight: 500; }
  .bempty { font-size: 11px; color: var(--text3); text-align: center; padding: 14px 4px; border: 1px dashed rgba(255,255,255,.09); border-radius: 10px; }
  .drag-ghost { position: fixed; z-index: 80; pointer-events: none; opacity: .92; box-shadow: 0 14px 34px rgba(0,0,0,.6); transform: rotate(1.5deg); background: #17171c; }


  @media (min-width: 900px) {
    .wrap { max-width: 1180px; padding: 0 32px 64px; }
    h1 { font-size: 24px; }
    .mark { width: 38px; height: 38px; }
    .digest { font-size: 13.5px; }
    .card { padding: 15px 18px; }
    section { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    section .sect-label, section .empty { grid-column: 1 / -1; }
    .board { overflow-x: visible; margin: 0; padding: 2px 0 10px; }
    .bcol { flex: 1 1 0; max-width: none; }
    .searchbox input { font-size: 15px; }
  }

  .skel { border-radius: 15px; height: 86px; margin-bottom: 9px; background: linear-gradient(100deg, rgba(255,255,255,.04) 40%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.04) 60%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="ptr"><div class="pill"><div class="spin"></div></div></div>
<div class="wrap">
  <header>
    <div class="title-block">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></div>
      <h1>Mission Control</h1>
    </div>
    <div class="live" id="livepill"><span class="dot"></span>LIVE</div>
  </header>
  <div class="digest" id="digest"></div>
  <div class="updated" id="updated">Syncing…</div>
  <div id="away"></div>
  <div class="searchbox"><div class="in">
    <svg viewBox="0 0 24 24" fill="none" stroke="#9d9da8" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  </div></div>
  <div class="chips" id="chips"></div>
  <div class="chips areas" id="areachips"></div>
  <div class="vtoggle" id="vtoggle"></div>
  <div id="err"></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="body" id="sheetbody"></div>
  <div class="replybox" id="replybox"><textarea id="replytext" placeholder="Reply to Instinct about this..." rows="1"></textarea><button id="replysend">Send</button></div>
</div>
<div id="toast"><span id="toastmsg"></span><button id="toastundo">Undo</button></div>
<canvas id="confetti"></canvas>
<script>
window.__booterr = null;
window.onerror = function(msg, src, l, c) { window.__booterr = msg + ' @' + l + ':' + c; var u = document.querySelector('#updated'); if (u && !window.DATA) u.textContent = 'Boot error: ' + window.__booterr; };

const DATA_URL = 'd.json'; // same-origin ciphertext; key arrives in URL fragment (#k=...)
async function loadKey() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  const b64 = m[1] + '==';
  const raw = Uint8Array.from(atob(b64.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
}
async function fetchData() {
  const key = await loadKey();
  if (!key) throw new Error('nokey');
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), 15000);
  let r;
  try { r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store', signal: ac.signal}); }
  finally { clearTimeout(to); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const b64 = (await r.text()).trim();
  const bin = atob(b64);
  const buf = Uint8Array.from(bin, c => c.charCodeAt(0));
  const iv = buf.slice(0, 12), ct = buf.slice(12);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

let SORTS = JSON.parse(localStorage.getItem('mc_sorts') || '{}');
let lastDataUpdated = null;

const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rel(ts) {
  if (!ts) return '';
  const d = new Date(ts), s = (Date.now() - d.getTime())/1000;
  const fut = s < 0, a = Math.abs(s);
  const f = (v,u) => { v = Math.round(v); return v + u; };
  let str;
  if (a < 90) return 'just now';
  else if (a < 3600) str = f(a/60,'m');
  else if (a < 86400) str = f(a/3600,'h');
  else str = f(a/86400,'d');
  return fut ? 'in ' + str : str + ' ago';
}
function absTime(ts) {
  const d = new Date(ts), today = new Date(), tom = new Date(Date.now() + 864e5);
  const same = (a,b) => a.toDateString() === b.toDateString();
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if (same(d, today)) return 'Today ' + t;
  if (same(d, tom)) return 'Tmrw ' + t;
  return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' + t;
}
const itemId = (sec, t) => sec + ':' + (t.id || t.url || t.name + '|' + (t.next_fire||''));
const match = txt => !QUERY || txt.toLowerCase().includes(QUERY);
const inArea = t => AREA === 'all' || (t.area || 'Life admin') === AREA;

  {key:'done',      label:'Done',           color:'var(--done)', sortable:true},
  {key:'hidden',    label:'Hidden',         color:'#71717a'},
];
const EMPTY = {
  waiting: ['All clear', 'Nothing needs you right now.'],

  watching: ['Nothing on watch', 'No standing monitors running.'],

function sortItems(key, items) {
  const mode = SORTS[key] || 'new';
  const ts = t => new Date(t.updated_at || t.created_at || t.modified || 0).getTime();
  const arr = [...items];
  if (mode === 'old') arr.sort((a,b) => ts(a) - ts(b));
  else arr.sort((a,b) => ts(b) - ts(a));
  arr.sort((a,b) => (PINNED.has(itemId(key, b)) ? 1 : 0) - (PINNED.has(itemId(key, a)) ? 1 : 0));
  return arr;
}
function togglePin(sec, t) {
  const id = itemId(sec, t);
  PINNED.has(id) ? PINNED.delete(id) : PINNED.add(id);
  localStorage.setItem('mc_pinned', JSON.stringify([...PINNED]));
  render();
}

function actsHtml(sec, t) {
  const id = itemId(sec, t);
  const p = PINNED.has(id);
  const title = esc(t.title || t.name || '');
  let acts = '';
  if (sec === 'waiting') acts = `<button class="act" data-act="Done" data-title="${title}">Done</button><button class="act" data-act="Snooze" data-title="${title}">Snooze</button><button class="act" data-act="Kill" data-title="${title}">Kill</button>`;
  else if (sec === 'progress' || sec === 'watching') acts = `<button class="act" data-act="Nudge" data-title="${title}">Nudge</button>`;
  return `<div class="acts">${acts}<button class="${p ? 'pinned' : ''}" data-pin="${esc(id)}" data-sec="${sec}">${p ? 'Unpin' : 'Pin'}</button><button data-del="${esc(id)}" data-sec="${sec}">Delete</button></div>`;
}
function toastPlain(msg, ms) {
  $('#toastmsg').textContent = msg;
  $('#toastundo').style.visibility = 'hidden';
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('on'); $('#toastundo').style.visibility = ''; }, ms || 3200);
}
async function actHandoff(act, title) {
  const body = act + ': ' + title;
  if (navigator.maxTouchPoints > 0) location.href = 'sms:' + REPLY_NUMBER + '?&body=' + encodeURIComponent(body);
  else { try { await navigator.clipboard.writeText(body); } catch (e) {} toastPlain('Copied - paste it into your Instinct text thread to send'); }
}
function cycleSort(key) {
  const order = ['new','old'];
  SORTS[key] = order[(order.indexOf(SORTS[key] || 'new') + 1) % order.length];
  localStorage.setItem('mc_sorts', JSON.stringify(SORTS));
  render();
}

function hide(sec, t, el) {
  const id = itemId(sec, t);
  HIDDEN.add(id);
  localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN]));
  if (navigator.vibrate) navigator.vibrate(8);
  el.classList.add('leaving');
  setTimeout(() => { render(); showToast('Hidden', () => { HIDDEN.delete(id); localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN])); render(); }); }, 210);
}
function restore(id) {
  HIDDEN.delete(id);
  localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN]));
  if (navigator.vibrate) navigator.vibrate(6);
  render();
}

let toastTimer = null;
function showToast(msg, onUndo) {
  $('#toastmsg').textContent = msg;
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  $('#toastundo').onclick = () => { $('#toast').classList.remove('on'); onUndo && onUndo(); };
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 3600);
}

// tiny sparkle burst (restrained)
function sparkle(x, y) {
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const parts = Array.from({length: 14}, (_, i) => {
    const a = (i / 14) * Math.PI * 2 + Math.random() * .5;
    return {x, y, vx: Math.cos(a) * (1 + Math.random() * 2.2), vy: Math.sin(a) * (1 + Math.random() * 2.2) - 1.4, life: 1};
  });
  const colors = ['#4ade80', '#6ea8fe', '#b79ffd', '#fbbf24'];
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy; p.vy += .07; p.life -= .022;
      if (p.life <= 0) return;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = colors[i % 4];
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.1, 0, 7); ctx.fill();
    });
    if (++f < 60) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

function cardSwipe(el, sec, t) {
  let startX = null, curX = 0, hint = null;
  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
  el.addEventListener('touchmove', e => {
    if (startX === null) return;
    curX = e.touches[0].clientX - startX;
    if (Math.abs(curX) < 12) return;
    el._swiped = true;
    if (!hint) { hint = document.createElement('div'); hint.className = 'swipe-hint' + (curX > 0 ? ' left' : ''); hint.textContent = 'DELETE'; el.parentElement.style.position = 'relative'; el.parentElement.appendChild(hint); }
    el.style.transition = 'none';
    el.style.transform = `translateX(${curX}px)`;
    hint.style.opacity = Math.min(1, Math.abs(curX) / 80);
  }, {passive: true});
  el.addEventListener('touchend', () => {
    if (hint) { hint.remove(); hint = null; }
    el.style.transition = '';
    if (Math.abs(curX) > 85) { hide(sec, t, el); }
    else el.style.transform = '';
    startX = null; curX = 0;
    setTimeout(() => { el._swiped = false; }, 60);
  });
}

function render() {
  if (!DATA) return;
  const d = DATA;
  const split = { progress: d.progress.filter(a => !a.standing), watching: d.progress.filter(a => a.standing) };
  const sets = {
    waiting: d.waiting, progress: split.progress, watching: split.watching,
    reminders: d.reminders, docs: d.docs, done: d.done,
    hidden: collectHidden(d),
  };
  const vis = k => sets[k].filter(t => !HIDDEN.has(itemId(k, t)));
  const counts = { waiting: vis('waiting').length, progress: vis('progress').length, watching: vis('watching').length, reminders: vis('reminders').length, docs: vis('docs').length, done: vis('done').length, hidden: sets.hidden.length };
  const total = counts.waiting + counts.progress + counts.watching + counts.reminders + counts.docs + counts.done;

  let pinnedN = 0, pinnedWaiting = 0;
  ['waiting','progress','watching','reminders','docs','done'].forEach(k => vis(k).forEach(t => { if (PINNED.has(itemId(k, t))) { pinnedN++; if (k === 'waiting') pinnedWaiting++; } }));
  const focusN = pinnedN + counts.waiting - pinnedWaiting;
  $('#chips').innerHTML = [{key:'focus',label:'Focus',n:focusN,color:'#7cc7ff'}, {key:'all',label:'All',n:total}, ...SECTIONS.map(s=>({key:s.key,label:s.label,n:counts[s.key],color:s.color}))]
    .map(c => `<div class="chip ${FILTER===c.key?'active':''}" data-k="${c.key}">${c.color?`<span class="cdot" style="background:${c.color}"></span>`:''}${c.label}<span class="n">${c.n}</span></div>`).join('');
  document.querySelectorAll('#chips .chip').forEach(el => el.onclick = () => { FILTER = el.dataset.k; render(); });

  const areas = [...new Set([...d.waiting, ...d.progress, ...d.done].map(t => t.area || 'Life admin'))].sort();
  $('#areachips').innerHTML = [{a:'all'}, ...areas.map(a => ({a}))]
    .map(x => `<div class="chip area ${AREA===x.a?'active':''}" data-a="${esc(x.a)}">${x.a === 'all' ? 'All areas' : esc(x.a)}</div>`).join('');
  document.querySelectorAll('#areachips .chip').forEach(el => el.onclick = () => { AREA = el.dataset.a; render(); });

  renderVToggle();
  $('#chips').style.display = VIEW === 'board' ? 'none' : '';

  let html = '';
  const show = k => FILTER === 'all' || FILTER === k;

  if (VIEW === 'board') {
    html = renderBoard(sets, vis);
  } else if (FILTER === 'focus') {
    const pinnedItems = [];
    ['waiting','progress','watching','reminders','docs','done'].forEach(k => {
      sortItems(k, vis(k)).forEach(t => {
        if (PINNED.has(itemId(k, t)) && match((t.title || t.name || '') + ' ' + (t.description || t.summary || '')) && inArea(t)) pinnedItems.push({k, t});
      });
    });
    const waitItems = sortItems('waiting', vis('waiting').filter(t => !PINNED.has(itemId('waiting', t)) && match(t.title + ' ' + (t.description || '')) && inArea(t)));
    html += focusSect('Pinned', '#7cc7ff', pinnedItems.length, pinnedItems.map(x => compactCard(x.k, x.t)).join(''), 'Nothing pinned', 'Pin anything from the full list and it lives here.');
    html += focusSect('Needs you', 'var(--waiting)', waitItems.length, waitItems.map(t => compactCard('waiting', t)).join(''), 'All clear', 'Nothing needs you right now.');
    html += '<div class="foc-note">Everything else is behind the chips above - <b>All</b> shows the full board.</div>';
  } else {
  const sortLabel = k => (SORTS[k] || 'new') === 'new' ? 'NEWEST' : 'OLDEST';

  if (show('waiting')) {
    const items = sortItems('waiting', vis('waiting').filter(t => match(t.title + ' ' + (t.description||'')) && inArea(t)));
    html += sect('waiting', counts.waiting, items.map(t => `
      <div class="card" data-sec="waiting"><div class="t">${esc(t.title)}</div>
      ${t.description ? `<div class="d">${esc(t.description)}</div>` : ''}
      <div class="meta">${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}${t.blocked ? '<span class="tag" style="color:#fca5a5;background:rgba(248,113,113,.1)">Blocked</span>' : ''}<span class="r">added ${rel(t.created_at)}</span></div>${actsHtml('waiting', t)}</div>`).join(''));
  }
  if (show('progress')) {
    const items = sortItems('progress', vis('progress').filter(t => match(t.name + ' ' + (t.summary||'')) && inArea(t)));
    html += sect('progress', counts.progress, items.map(t => `
      <div class="card" data-sec="progress"><div class="t prog-row"><span class="prog-dot"></span>${esc(t.name)}</div>
      ${t.summary ? `<div class="d">${esc(t.summary)}</div>` : ''}
      <div class="meta">${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}${t.next_fire ? `<span>Next check ${absTime(t.next_fire)}</span>` : '<span>Active now</span>'}</div>${actsHtml('progress', t)}</div>`).join(''));
  }
  if (show('watching')) {
    const items = sortItems('watching', vis('watching').filter(t => match(t.name + ' ' + (t.summary||'')) && inArea(t)));
    html += sect('watching', counts.watching, items.map(t => `
      <div class="card" data-sec="watching"><div class="t">${esc(t.name)}</div>
      ${t.summary ? `<div class="d">${esc(t.summary)}</div>` : ''}
      <div class="meta">${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}${t.next_fire ? `<span>Next check ${absTime(t.next_fire)}</span>` : '<span>Running</span>'}<span class="r"><span class="tag">Standing</span></span></div>${actsHtml('watching', t)}</div>`).join(''));
  }
  if (show('reminders')) {
    const items = sortItems('reminders', vis('reminders').filter(t => match(t.name) && inArea(t)));
    html += sect('reminders', counts.reminders, items.map(t => `
      <div class="card" data-sec="reminders"><div class="t">${esc(t.name)}</div>
      <div class="meta"><span style="color:var(--remind)">${absTime(t.next_fire)}</span><span class="r">${esc(t.cadence||'')}</span></div>${actsHtml('reminders', t)}</div>`).join(''));
  }
  if (show('docs')) {
    const items = sortItems('docs', vis('docs').filter(t => match(t.name + ' ' + (t.folder||'')) && inArea(t)));
    html += sect('docs', counts.docs, items.map(t => `
      <a class="card" data-sec="docs" href="${esc(t.url)}" target="_blank" rel="noopener"><span class="ext">${EXT}</span><div class="t">${esc(t.name)}</div>
      <div class="meta"><span class="tag" style="color:var(--docs)">${esc(t.folder||'Drive')}</span><span class="r">edited ${rel(t.modified)}</span></div>${actsHtml('docs', t)}</a>`).join(''));
  }
  if (show('done')) {
    const items = sortItems('done', vis('done').filter(t => match(t.title) && inArea(t)));
    html += sect('done', counts.done, items.map(t => `
      <div class="card done-card" data-sec="done"><div class="t">${esc(t.title)}</div>
      <div class="meta">${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}<span class="r">${rel(t.updated_at)}</span></div>${actsHtml('done', t)}</div>`).join(''));
  }
  if (show('hidden') && (FILTER === 'hidden')) {
    html += sect('hidden', counts.hidden, sets.hidden.map(t => `
      <div class="card hidden-card"><div class="t">${esc(t.title || t.name)}</div>
      <div class="restore" data-restore="${esc(t._hid)}">Restore</div></div>`).join(''));
  }
  }
  $('#main').innerHTML = html || '<div class="empty"><span class="big">Nothing matches</span>Try a different search or filter.</div>';
  document.querySelectorAll('[data-restore]').forEach(el => el.onclick = () => restore(el.dataset.restore));
  document.querySelectorAll('[data-pin]').forEach(el => el.onclick = e => {
    e.stopPropagation(); e.preventDefault();
    const t = (sets[el.dataset.sec] || []).find(x => itemId(el.dataset.sec, x) === el.dataset.pin);
    if (t) togglePin(el.dataset.sec, t);
  });
  document.querySelectorAll('[data-act]').forEach(el => el.onclick = e => {
    e.stopPropagation(); e.preventDefault();
    actHandoff(el.dataset.act, el.dataset.title);
  });
  document.querySelectorAll('[data-del]').forEach(el => el.onclick = e => {
    e.stopPropagation(); e.preventDefault();
    const t = (sets[el.dataset.sec] || []).find(x => itemId(el.dataset.sec, x) === el.dataset.del);
    if (t) { HIDDEN.add(el.dataset.del); localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN])); render(); showToast('Deleted - find it in Hidden', () => { HIDDEN.delete(el.dataset.del); localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN])); render(); }); }
  });

  // wire swipes
  const byId = {};
  SECTIONS.forEach(s => (sets[s.key] || []).forEach(t => byId[itemId(s.key, t)] = t));
  // simpler: attach swipe with closure over matching item by title
  document.querySelectorAll('.card[data-sec]').forEach(el => {
    const sec = el.dataset.sec;
    const title = el.querySelector('.t')?.textContent || '';
    const t = (sets[sec] || []).find(x => (x.title || x.name) === title && !HIDDEN.has(itemId(sec, x)));
    if (t && PINNED.has(itemId(sec, t))) el.classList.add('is-pinned');
    if (t) cardSwipe(el, sec, t);
    if (t && sec !== 'docs') el.addEventListener('click', () => { if (!el._swiped) openDetail(sec, t); });
  });

  if (VIEW === 'board') {
    const rawOf = t => t.id || t.url || ((t.name || '') + '|' + (t.next_fire || ''));
    document.querySelectorAll('.bcard').forEach(el => {
      const sec = el.dataset.sec;
      const t = (sets[sec] || []).find(x => rawOf(x) === el.dataset.raw);
      if (!t) return;
      boardDrag(el, el.dataset.raw, el.dataset.colCur, t.title || t.name || '');
      el.addEventListener('click', () => { if (!el._dragged) openDetail(sec, t); });
    });
  }

  $('#updated').textContent = 'Synced ' + rel(d.updated_at) + '  ·  every 15 min  ·  tap to reload';
  $('#foot').innerHTML = d.status_doc_url ? `<a href="${esc(d.status_doc_url)}" target="_blank" rel="noopener">Full status doc${EXT}</a>` : '';
  renderDigest(d, counts);
}

  $('#vtoggle').innerHTML = `<button data-v="list" class="${VIEW === 'list' ? 'active' : ''}">List</button><button data-v="board" class="${VIEW === 'board' ? 'active' : ''}">Board</button>`;
  document.querySelectorAll('#vtoggle button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; localStorage.setItem('mc_view', VIEW); render(); });
}
function renderBoard(sets, vis) {
  const raw = t => t.id || t.url || ((t.name || '') + '|' + (t.next_fire || ''));
  const cols = [
    {key: 'waiting', label: 'Needs you', color: 'var(--waiting)'},
    {key: 'progress', label: 'In progress', color: 'var(--progress)'},
    {key: 'watching', label: 'Watching', color: 'var(--watching)'},
    {key: 'done', label: 'Done', color: '#4ade80'},
  ];
  const buckets = {waiting: [], progress: [], watching: [], done: []};
  ['waiting', 'progress', 'watching', 'done'].forEach(k => {
    vis(k).forEach(t => {
      if (!match((t.title || t.name || '') + ' ' + (t.description || t.summary || '')) || !inArea(t)) return;
      const ov = MCOL[raw(t)];
      buckets[ov && buckets[ov] !== undefined ? ov : k].push({sec: k, t});
    });
  });
  let h = '<div class="board">';
  cols.forEach(c => {
    h += `<div class="bcol" data-col="${c.key}"><div class="bh"><span style="background:${c.color};width:6px;height:6px;border-radius:50%;display:inline-block"></span>${c.label}<span style="margin-left:auto;color:var(--text3)">${buckets[c.key].length}</span></div>`;
    buckets[c.key].forEach(x => {
      const title = esc(x.t.title || x.t.name || '');
      const moved = MCOL[raw(x.t)] && MCOL[raw(x.t)] !== x.sec;
      h += `<div class="bcard${moved ? ' moved' : ''}" data-raw="${esc(raw(x.t))}" data-sec="${x.sec}" data-col-cur="${c.key}"><div class="bt">${title}</div><div class="bm">${x.t.area ? esc(x.t.area) + ' · ' : ''}${c.key === 'done' ? rel(x.t.updated_at) : (x.t.next_fire ? 'next ' + rel(x.t.next_fire) : rel(x.t.created_at))}</div></div>`;
    });
    if (!buckets[c.key].length) h += '<div class="bempty">Drop cards here</div>';
    h += '</div>';
  });
  return h + '</div>';
}
function boardDrag(el, rawKey, fromCol, title) {
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const sx = e.clientX, sy = e.clientY;
    let dragging = false, cancelled = false, ghost = null;
    const lp = setTimeout(activate, e.pointerType === 'touch' ? 260 : 0);
    function activate() {
      if (cancelled) return;
      dragging = true;
      ghost = el.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = el.offsetWidth + 'px';
      document.body.appendChild(ghost);
      position(e);
      el.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(8);
    }
    function position(ev) {
      ghost.style.left = (ev.clientX - el.offsetWidth / 2) + 'px';
      ghost.style.top = (ev.clientY - 20) + 'px';
    }
    function hot(ev) {
      document.querySelectorAll('.bcol').forEach(c => {
        const r = c.getBoundingClientRect();
        c.classList.toggle('hot', ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom);
      });
    }
    function move(ev) {
      if (!dragging) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) { cancel(); }
        return;
      }
      ev.preventDefault();
      position(ev); hot(ev);
    }
    function up(ev) {
      clearTimeout(lp);
      cleanup();
      if (!dragging) return;
      el._dragged = true; setTimeout(() => { el._dragged = false; }, 90);
      const target = [...document.querySelectorAll('.bcol')].find(c => {
        const r = c.getBoundingClientRect();
        return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
      });
      if (target && target.dataset.col !== fromCol) {
        MCOL[rawKey] = target.dataset.col;
        localStorage.setItem('mc_col', JSON.stringify(MCOL));
        render();
        actHandoff(target.dataset.col === 'done' ? 'Done' : (target.dataset.col === 'waiting' ? 'Nudge' : 'Snooze'), title);
      } else el.classList.remove('dragging');
    }
    function cancel() { cancelled = true; clearTimeout(lp); cleanup(); }
    function cleanup() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      if (ghost) { ghost.remove(); ghost = null; }
      el.classList.remove('dragging');
      document.querySelectorAll('.bcol.hot').forEach(c => c.classList.remove('hot'));
    }
    window.addEventListener('pointermove', move, {passive: false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', cancel);
  });
}
function compactCard(sec, t) {
  const s = SECTIONS.find(x => x.key === sec);
  const title = esc(t.title || t.name || '');
  const dot = `<span style="background:${s.color};width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:7px"></span>`;
  let meta = '';
  if (sec === 'waiting') meta = `${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}${t.blocked ? '<span class="tag" style="color:#fca5a5;background:rgba(248,113,113,.1)">Blocked</span>' : ''}<span class="r">${rel(t.created_at)}</span>`;
  else if (sec === 'progress') meta = `${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}<span>${t.next_fire ? 'Next check ' + absTime(t.next_fire) : 'Active now'}</span>`;
  else if (sec === 'watching') meta = `<span>${t.next_fire ? 'Next check ' + absTime(t.next_fire) : 'Running'}</span><span class="r"><span class="tag">Standing</span></span>`;
  else if (sec === 'reminders') meta = `<span style="color:var(--remind)">${absTime(t.next_fire)}</span><span class="r">${esc(t.cadence || '')}</span>`;
  else if (sec === 'docs') meta = `<span class="tag" style="color:var(--docs)">${esc(t.folder || 'Drive')}</span><span class="r">${rel(t.modified)}</span>`;
  else if (sec === 'done') meta = `${t.area ? `<span class="tag">${esc(t.area)}</span>` : ''}<span class="r">${rel(t.updated_at)}</span>`;
  const inner = `<div class="t">${dot}${title}</div><div class="meta">${meta}</div>${actsHtml(sec, t)}`;
  if (sec === 'docs') return `<a class="card compact" data-sec="docs" href="${esc(t.url)}" target="_blank" rel="noopener">${inner}</a>`;
  return `<div class="card compact${sec === 'done' ? ' done-card' : ''}${PINNED.has(itemId(sec, t)) ? ' is-pinned' : ''}" data-sec="${sec}">${inner}</div>`;
}
function focusSect(label, color, count, inner, emptyBig, emptySub) {
  return `<section><div class="sect-label"><span class="dot" style="background:${color}"></span><span class="name">${label}</span><span class="count" style="margin-left:auto">${count}</span></div>${inner || `<div class="empty"><span class="big">${emptyBig}</span>${emptySub}</div>`}</section>`;
}
function collectHidden(d) {
  const out = [];
  d.waiting.forEach(t => { const id = itemId('waiting', t); if (HIDDEN.has(id)) out.push({...t, _hid: id}); });
  d.progress.forEach(t => { ['progress','watching'].forEach(sec => { const id = itemId(sec, t); if (HIDDEN.has(id)) out.push({...t, _hid: id}); }); });
  d.reminders.forEach(t => { const id = itemId('reminders', t); if (HIDDEN.has(id)) out.push({...t, _hid: id}); });
  d.docs.forEach(t => { const id = itemId('docs', t); if (HIDDEN.has(id)) out.push({...t, _hid: id}); });
  d.done.forEach(t => { const id = itemId('done', t); if (HIDDEN.has(id)) out.push({...t, _hid: id}); });
  return out;
}
function sect(key, count, inner) {
  const s = SECTIONS.find(x => x.key === key);
  const sortBtn = s.sortable ? `<button class="sortbtn" onclick="cycleSort('${key}')">${SORTICON} ${(SORTS[key]||'new')==='new'?'NEWEST':'OLDEST'}</button>` : `<span class="count" style="margin-left:auto">${count}</span>`;
  const e = EMPTY[key];
  return `<section><div class="sect-label"><span class="dot" style="background:${s.color}"></span><span class="name">${s.label}</span>${s.sortable ? `<span class="count">${count}</span>` : ''}${sortBtn}</div>${inner || `<div class="empty"><span class="big">${e[0]}</span>${e[1]}</div>`}</section>`;
}

function renderDigest(d, counts) {
  const day = new Date().toLocaleDateString([], {weekday: 'long'});
  const landedToday = d.done.filter(t => (Date.now() - new Date(t.updated_at)) < 864e5).length;
  const parts = [];
  if (landedToday) parts.push(landedToday + ' landed today');
  parts.push(counts.progress + counts.watching + ' moving');
  if (counts.waiting) parts.push(counts.waiting + ' need' + (counts.waiting === 1 ? 's' : '') + ' you');
  $('#digest').textContent = day + ': ' + parts.join(' · ');
}

// since-you-were-away
function checkAway(d) {
  try {
    const seen = JSON.parse(localStorage.getItem('mc_seen') || 'null');
    const snap = { done: d.done.map(t => t.id || t.title), waiting: d.waiting.map(t => t.id), at: Date.now() };
    if (seen && seen.at && Date.now() - seen.at > 30 * 60e3) {
      const newDone = snap.done.filter(x => !seen.done.includes(x)).length;
      const newWaiting = snap.waiting.filter(x => !seen.waiting.includes(x)).length;
      if (newDone || newWaiting) {
        const bits = [];
        if (newDone) bits.push(newDone + ' landed');
        if (newWaiting) bits.push(newWaiting + ' new thing' + (newWaiting > 1 ? 's' : '') + ' need' + (newWaiting > 1 ? '' : 's') + ' you');
        $('#away').innerHTML = 'Since ' + new Date(seen.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) + ': ' + bits.join(' · ') + '<span class="sub">Tap to dismiss</span>';
        $('#away').style.display = 'block';
        if (newDone) setTimeout(() => sparkle(innerWidth / 2, 170), 500);
      }
    }
    localStorage.setItem('mc_seen', JSON.stringify(snap));
  } catch (e) {}
}
$('#away').onclick = () => $('#away').style.display = 'none';

async function load() {
  $('#ptr').classList.add('on');
  if (!DATA) $('#main').innerHTML = '<div class="skel"></div>'.repeat(5);
  try {
    const fresh = await fetchData();
    const isNewer = lastDataUpdated && fresh.updated_at !== lastDataUpdated;
    DATA = fresh; lastDataUpdated = fresh.updated_at;
    try { localStorage.setItem('mc_data', JSON.stringify(fresh)); } catch (e) {}
    $('#err').style.display = 'none';
    render(); checkAway(fresh);
    if (isNewer) {
      $('#livepill').classList.add('fresh');
      setTimeout(() => $('#livepill').classList.remove('fresh'), 2600);
    }
  } catch (e) {
    if (DATA) { $('#err').textContent = 'Refresh failed — showing last synced data.'; $('#err').style.display = 'block'; render(); }
    else if (e.message === 'nokey') $('#updated').textContent = 'Open this app from your personal link (it carries the access key).';
    else {
      $('#updated').textContent = 'Still syncing - slow connection, retrying…';
      clearTimeout(window.__retryT);
      window.__retryT = setTimeout(() => { if (!DATA) load(); }, 4000);
    }
  } finally {
    setTimeout(() => $('#ptr').classList.remove('on'), 350);
  }
}


// ---- detail sheet ----
const REPLY_NUMBER = '+16503469144'; // Instinct's iMessage line
let SHEET_CTX = null;
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./,''); } catch (e) { return u.slice(0, 40); } }
function openDetail(sec, t) {
  SHEET_CTX = { sec, id: t.id || t.name || '', title: t.title || t.name || '' };
  const b = $('#sheetbody');
  let h = `<h2>${esc(t.title || t.name)}</h2><div class="smeta">${esc(sec.toUpperCase())}${t.area ? ' · ' + esc(t.area) : ''}${t.created_at ? ' · added ' + rel(t.created_at) : ''}${t.updated_at ? ' · ' + rel(t.updated_at) : ''}${t.next_fire ? ' · next ' + rel(t.next_fire) : ''}</div>`;
  if (t.summary && sec !== 'waiting') h += `<div class="detail" style="margin-bottom:4px">${esc(t.summary)}</div>`;
  if (t.detail) h += `<div class="detail">${esc(t.detail)}</div>`;
  if (t.url) h += `<div class="sect-h">LINK</div><div class="links"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(hostOf(t.url))}</a></div>`;
  if (t.links && t.links.length) h += `<div class="sect-h">LINKS & OUTPUTS</div><div class="links">` + t.links.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(hostOf(u))}</a>`).join('') + `</div>`;
  if (t.thread && t.thread.length) h += `<div class="sect-h">THREAD</div>` + t.thread.map(m => `<div class="msg"><div class="mt">${rel(m.ts)}</div><div class="mb">${esc(m.text)}</div></div>`).join('');
  if (!t.detail && !t.thread && !(t.links||[]).length && !t.url) h += `<div class="detail" style="color:var(--text3)">No extra detail on this one yet - ask me anything about it below.</div>`;
  h += `<div class="actrow"><button id="sheetpin" class="${PINNED.has(itemId(sec, t)) ? 'pinned' : ''}">${PINNED.has(itemId(sec, t)) ? 'Unpin' : 'Pin to top'}</button><button id="sheetdel">Delete</button></div>`;
  b.innerHTML = h;
  $('#sheetpin').onclick = () => { togglePin(sec, t); closeDetail(); };
  $('#sheetdel').onclick = () => {
    const id = itemId(sec, t);
    HIDDEN.add(id); localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN]));
    closeDetail(); render();
    showToast('Deleted - find it in Hidden', () => { HIDDEN.delete(id); localStorage.setItem('mc_hidden', JSON.stringify([...HIDDEN])); render(); });
  };
  $('#replytext').value = '';
  $('#backdrop').classList.add('on'); $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  $('#backdrop').classList.remove('on'); $('#sheet').classList.remove('on');
  document.body.style.overflow = '';
}
$('#backdrop').onclick = closeDetail;
$('#replysend').onclick = async () => {
  const txt = $('#replytext').value.trim();
  if (!txt || !SHEET_CTX) return;
  const body = 'Re: ' + SHEET_CTX.title.slice(0, 80) + '\n\n' + txt;
  if (navigator.maxTouchPoints > 0) {
    location.href = 'sms:' + REPLY_NUMBER + '?&body=' + encodeURIComponent(body);
    $('#replytext').value = '';
  } else {
    try { await navigator.clipboard.writeText(body); } catch (e) {}
    $('#replytext').value = '';
    closeDetail();
    $('#toastmsg').textContent = 'Reply copied - paste it into your Instinct text thread to send';
    $('#toastundo').style.visibility = 'hidden';
    $('#toast').classList.add('on');
    setTimeout(() => { $('#toast').classList.remove('on'); $('#toastundo').style.visibility = ''; }, 4500);
  }
};
$('#q').addEventListener('input', e => { QUERY = e.target.value.trim().toLowerCase(); render(); });
$('#updated').addEventListener('click', load);

let touchY = null;
window.addEventListener('touchstart', e => { if (window.scrollY <= 0 && !e.target.closest('.card')) touchY = e.touches[0].clientY; }, {passive: true});
window.addEventListener('touchmove', e => {
  if (touchY === null) return;
  if (e.touches[0].clientY - touchY > 75 && window.scrollY <= 0) { touchY = null; load(); }
}, {passive: true});
window.addEventListener('touchend', () => touchY = null);

try {
  const cached = localStorage.getItem('mc_data');
  if (cached) { DATA = JSON.parse(cached); lastDataUpdated = DATA.updated_at; render(); }
} catch (e) {}
load();
setInterval(load, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
